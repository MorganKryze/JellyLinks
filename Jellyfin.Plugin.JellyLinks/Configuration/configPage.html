<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>JellyLinks</title></head>
<body>
<div id="JellyLinksConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-select">
<style>
  #JellyLinksConfigPage .jl-tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--jl-divider);margin-bottom:1.2em}
  #JellyLinksConfigPage .jl-tabs::-webkit-scrollbar{display:none}
  #JellyLinksConfigPage .jl-tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:inherit;padding:.8em 1.1em;margin-bottom:-1px;cursor:pointer;opacity:.7;font:inherit;white-space:nowrap}
  #JellyLinksConfigPage .jl-tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--jl-accent)}
  #JellyLinksConfigPage .jlKpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:.7em;margin-bottom:1.2em}
  #JellyLinksConfigPage .jlKpi{width:100%;margin:0;box-sizing:border-box;justify-content:flex-start;border:0;border-radius:var(--jl-radius);padding:.8em 1em;display:flex;flex-direction:column;gap:.25em;text-align:left;color:inherit;font:inherit}
  #JellyLinksConfigPage button.jlKpi{cursor:pointer}
  #JellyLinksConfigPage .jlKpiValue{font-size:1.6em;font-weight:600;display:flex;align-items:center;gap:.3em}
  #JellyLinksConfigPage .jlTone-warn .jlKpiValue{color:var(--jl-warn-fg)}
  #JellyLinksConfigPage .jlTone-bad .jlKpiValue{color:var(--jl-bad-fg)}
  #JellyLinksConfigPage .jlFilters{display:flex;flex-wrap:wrap;gap:0 1em;align-items:flex-end}
  #JellyLinksConfigPage .jlFilters .inputContainer,#JellyLinksConfigPage .jlFilters .selectContainer{margin-bottom:1em;flex:1 1 11em}
  #JellyLinksConfigPage .jlFilters .jlSearch{flex:3 1 18em}
  #JellyLinksConfigPage .jlChartBox{position:relative;margin-bottom:1em}
  #JellyLinksConfigPage .jlChart{display:block}
  #JellyLinksConfigPage .jlChart text{fill:var(--jl-muted);font-size:11px}
  #JellyLinksConfigPage .jlChart line{stroke:var(--jl-divider)}
  #JellyLinksConfigPage .jlChart .jlDay:focus{outline:2px solid var(--jl-accent)}
  #JellyLinksConfigPage .jlTip{position:absolute;top:0;z-index:2;min-width:12em;padding:.6em .8em;border-radius:var(--jl-radius);background:var(--jl-surface);border:1px solid var(--jl-divider);pointer-events:none;font-size:.9em}
  #JellyLinksConfigPage .jlLegend{display:flex;flex-wrap:wrap;gap:.4em 1em;margin:.4em 0}
  #JellyLinksConfigPage .jlSwatch{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:middle}
  #JellyLinksConfigPage .jlCols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1em}
  #JellyLinksConfigPage .jlPager{display:flex;align-items:center;gap:.6em;justify-content:flex-end}
  #JellyLinksConfigPage .jlDanger{border:1px solid var(--jl-bad-fg);border-radius:var(--jl-radius);padding:1em;margin-top:2em}
  .jlDialog.jlWide:not(.jlFull){width:min(880px,94vw)}
  #JellyLinksConfigPage .jlInline,.jlDialog .jlInline{display:flex;flex-wrap:wrap;align-items:center;gap:.8em;margin:1em 0}
</style>
<div data-role="content">
<div class="content-primary jlAdmin">
  <h2 class="sectionTitle">JellyLinks</h2>
  <div id="jl-dep" class="jlAlert jl-warn" data-t="admin.dep" hidden></div>
  <div class="jl-tabs" role="tablist" aria-label="JellyLinks">
    <button type="button" class="jl-tab" data-tab="overview" id="jl-tab-overview" role="tab" aria-controls="jl-pane-overview" data-t="tab.overview"></button>
    <button type="button" class="jl-tab" data-tab="batches" id="jl-tab-batches" role="tab" aria-controls="jl-pane-batches" data-t="tab.batches"></button>
    <button type="button" class="jl-tab" data-tab="activity" id="jl-tab-activity" role="tab" aria-controls="jl-pane-activity" data-t="tab.activity"></button>
    <button type="button" class="jl-tab" data-tab="users" id="jl-tab-users" role="tab" aria-controls="jl-pane-users" data-t="tab.users"></button>
    <button type="button" class="jl-tab" data-tab="settings" id="jl-tab-settings" role="tab" aria-controls="jl-pane-settings" data-t="tab.settings"></button>
  </div>
  <div id="jl-error" class="jlAlert jl-bad" role="alert" hidden></div>

  <div class="jl-pane" data-pane="overview" id="jl-pane-overview" role="tabpanel" aria-labelledby="jl-tab-overview">
    <div class="jlKpis" id="jl-kpis"></div>
    <h3 class="sectionTitle" id="jl-chart-title"></h3>
    <div class="jlChartBox" id="jl-chart"></div>
    <div class="jlCols">
      <div><h3 class="sectionTitle" data-t="top.titles"></h3><div id="jl-top-titles"></div></div>
      <div><h3 class="sectionTitle" data-t="top.users"></h3><div id="jl-top-users"></div></div>
    </div>
  </div>

  <div class="jl-pane" data-pane="batches" id="jl-pane-batches" role="tabpanel" aria-labelledby="jl-tab-batches" hidden>
    <div class="jlFilters">
      <div class="inputContainer jlSearch"><input is="emby-input" type="search" id="jl-b-q" data-tp="filter.search" data-ta="filter.search"></div>
      <div class="selectContainer"><select is="emby-select" id="jl-b-state" data-ta="col.state">
        <option value="" data-t="filter.allStates"></option><option value="active" data-t="state.active"></option>
        <option value="flagged" data-t="state.flagged"></option><option value="blocked" data-t="state.blocked"></option>
        <option value="revoked" data-t="state.revoked"></option><option value="expired" data-t="state.expired"></option></select></div>
      <div class="selectContainer"><select is="emby-select" id="jl-b-user" data-ta="col.user"><option value="" data-t="filter.allUsers"></option></select></div>
      <div class="selectContainer"><select is="emby-select" id="jl-b-days" data-ta="col.created">
        <option value="7" data-t="period.7"></option><option value="30" data-t="period.30" selected></option>
        <option value="90" data-t="period.90"></option><option value="0" data-t="period.all"></option></select></div>
    </div>
    <div id="jl-batches"></div>
    <div class="jlPager" id="jl-batches-pager"></div>
  </div>

  <div class="jl-pane" data-pane="activity" id="jl-pane-activity" role="tabpanel" aria-labelledby="jl-tab-activity" hidden>
    <div class="jlFilters">
      <div class="inputContainer jlSearch"><input is="emby-input" type="search" id="jl-a-q" data-tp="filter.searchActivity" data-ta="filter.searchActivity"></div>
      <div class="selectContainer"><select is="emby-select" id="jl-a-kind" data-ta="col.what"><option value="" data-t="filter.allKinds"></option></select></div>
      <div class="selectContainer"><select is="emby-select" id="jl-a-user" data-ta="col.user"><option value="" data-t="filter.allUsers"></option></select></div>
      <div class="selectContainer"><select is="emby-select" id="jl-a-days" data-ta="col.when">
        <option value="1" data-t="period.1"></option><option value="7" data-t="period.7" selected></option>
        <option value="30" data-t="period.30"></option><option value="90" data-t="period.90"></option></select></div>
    </div>
    <div id="jl-activity"></div>
    <div class="jlPager" id="jl-activity-pager"></div>
  </div>

  <div class="jl-pane" data-pane="users" id="jl-pane-users" role="tabpanel" aria-labelledby="jl-tab-users" hidden>
    <div id="jl-users"></div>
  </div>

  <div class="jl-pane" data-pane="settings" id="jl-pane-settings" role="tabpanel" aria-labelledby="jl-tab-settings" hidden>
    <form id="jl-settings" novalidate>
      <h3 class="sectionTitle" data-t="set.links"></h3>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-validity" data-t="set.validity"></label><input is="emby-input" type="number" id="jl-s-validity" min="1" max="365">
        <div class="fieldDescription jlFieldError" data-err="LinkValidityDays" hidden></div></div>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-iplimit" data-t="set.iplimit"></label><input is="emby-input" type="number" id="jl-s-iplimit" min="0" max="100">
        <div class="fieldDescription" data-t="set.iplimitHint"></div><div class="fieldDescription jlFieldError" data-err="IpLimit" hidden></div></div>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-public" data-t="set.public"></label><input is="emby-input" type="url" id="jl-s-public" placeholder="https://jellyfin.example">
        <div class="fieldDescription" data-t="set.publicHint"></div><div class="fieldDescription jlFieldError" data-err="PublicBaseUrl" hidden></div></div>
      <h3 class="sectionTitle" data-t="set.quota"></h3>
      <label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="jl-s-qon"><span data-t="set.qon"></span></label>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-qvol" data-t="set.qvol"></label><input is="emby-input" type="number" id="jl-s-qvol" min="0" step="any">
        <div class="fieldDescription" data-t="set.qvolHint"></div><div class="fieldDescription jlFieldError" data-err="QuotaVolumeBytes" hidden></div></div>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-qdays" data-t="set.qdays"></label><input is="emby-input" type="number" id="jl-s-qdays" min="1" max="365">
        <div class="fieldDescription jlFieldError" data-err="QuotaPeriodDays" hidden></div></div>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-qmax" data-t="set.qmax"></label><input is="emby-input" type="number" id="jl-s-qmax" min="0" max="1000">
        <div class="fieldDescription" data-t="set.qmaxHint"></div><div class="fieldDescription jlFieldError" data-err="QuotaMaxActiveBatches" hidden></div></div>
      <h3 class="sectionTitle" data-t="set.retention"></h3>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-ret" data-t="set.ret"></label><input is="emby-input" type="number" id="jl-s-ret" min="7" max="3650">
        <div class="fieldDescription" data-t="set.retHint"></div><div class="fieldDescription jlFieldError" data-err="RetentionDays" hidden></div></div>
      <h3 class="sectionTitle" data-t="set.webhook"></h3>
      <div class="inputContainer"><label class="inputLabel" for="jl-s-hook" data-t="set.hook"></label><input is="emby-input" type="url" id="jl-s-hook" placeholder="https://ntfy.example/jellylinks">
        <div class="fieldDescription jlFieldError" data-err="WebhookUrl" hidden></div></div>
      <div class="selectContainer"><label class="selectLabel" for="jl-s-fmt" data-t="set.fmt"></label><select is="emby-select" id="jl-s-fmt"><option value="ntfy">ntfy</option><option value="json">JSON</option></select>
        <div class="fieldDescription jlFieldError" data-err="WebhookFormat" hidden></div></div>
      <div class="fieldDescription" data-t="set.notify"></div>
      <label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="jl-s-n-blocked"><span data-t="set.n.blocked"></span></label>
      <label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="jl-s-n-ip"><span data-t="set.n.ip"></span></label>
      <label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="jl-s-n-quota"><span data-t="set.n.quota"></span></label>
      <label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="jl-s-n-done"><span data-t="set.n.done"></span></label>
      <div class="jlInline"><button is="emby-button" type="button" id="jl-s-test" class="raised button-cancel emby-button"><span data-t="set.test"></span></button><span id="jl-s-test-msg" aria-live="polite"></span></div>
      <div id="jl-s-errors" class="jlAlert jl-bad" role="alert" hidden></div>
      <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-t="set.save"></span></button>
    </form>
    <div class="jlDanger">
      <h3 class="sectionTitle" data-t="all.title"></h3>
      <p class="fieldDescription" data-t="all.text"></p>
      <button is="emby-button" type="button" id="jl-revoke-all" class="raised button-delete emby-button"><span data-t="all.button"></span></button>
    </div>
  </div>
</div>
</div>

<script type="text/javascript">
/* global ApiClient */
(function () {
  'use strict';
  var page = document.getElementById('JellyLinksConfigPage');
  var root = page.querySelector('.jlAdmin');
  var PAGE = 25;
  var KINDS = ['Session', 'BatchCreated', 'NewIp', 'BatchBlocked', 'QuotaReached', 'BatchCompleted', 'BatchRevoked', 'BatchUnblocked', 'LinkMoved', 'AllRevoked'];
  var STATE_TONES = { active: ['ok', ''], blocked: ['bad', 'block'], revoked: ['off', 'link_off'], expired: ['off', 'schedule'] };
  var SESSION_TONES = { in_progress: 'warn', complete: 'ok', interrupted: 'warn', abandoned: 'off' };
  var NS = 'http://www.w3.org/2000/svg';
  var JL = null, t = null, el = null;
  var users = [], globals = null, lastOverview = null, current = 'overview';
  var lists = { batches: { rows: [], page: 0 }, activity: { rows: [], page: 0 } };

  function $(id) { return document.getElementById(id); }

  /** The client core (dictionary, formats, theme, dialogs), served by the plugin: this page works without JavaScript Injector. */
  function loadCore() {
    if (window.JellyLinks && window.JellyLinks.t && window.JellyLinks.STRINGS) { return Promise.resolve(window.JellyLinks); }
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = ApiClient.getUrl('JellyLinks/client/core.js');
      s.onload = function () { resolve(window.JellyLinks); };
      s.onerror = function () { reject({ status: 0, body: null }); };
      document.head.appendChild(s);
    });
  }

  function translate() {
    Array.prototype.forEach.call(page.querySelectorAll('[data-t]'), function (n) { n.textContent = t(n.getAttribute('data-t')); });
    Array.prototype.forEach.call(page.querySelectorAll('[data-tp]'), function (n) { n.setAttribute('placeholder', t(n.getAttribute('data-tp'))); });
    Array.prototype.forEach.call(page.querySelectorAll('[data-ta]'), function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-ta'))); });
  }

  /** The first painted background behind the page: tooltips and sticky bars sit on it. */
  function surface() {
    var c = [page, document.body, document.documentElement];
    for (var i = 0; i < c.length; i++) { if (!JL.isTransparent(getComputedStyle(c[i]).backgroundColor)) { return c[i]; } }
    return null;
  }

  // ---- plumbing ---------------------------------------------------------------
  var STALE = {};
  var seq = {};
  /** Only the latest request of a list is rendered: a slower, older answer is dropped. */
  function latest(name, promise) {
    var n = seq[name] = (seq[name] || 0) + 1;
    return promise.then(function (v) { if (seq[name] !== n) { throw STALE; } return v; });
  }
  function showError(e) {
    if (e === STALE) { return; }
    $('jl-error').textContent = JL.errorText(e);
    $('jl-error').hidden = false;
  }
  function clearError(v) { $('jl-error').hidden = true; return v; }
  function run(p) { return p.then(clearError, showError); }
  function busy(p) {
    var D = window.Dashboard;
    if (D && D.showLoadingMsg) { D.showLoadingMsg(); }
    function hide() { if (D && D.hideLoadingMsg) { D.hideLoadingMsg(); } }
    return p.then(function (v) { hide(); return v; }, function (e) { hide(); throw e; });
  }
  function api(method, path, body) { return JL.api(method, 'admin/' + path, body); }
  function query(params) {
    return Object.keys(params).filter(function (k) { return params[k] !== '' && params[k] != null; })
      .map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  }
  function debounce(fn) { var h; return function () { clearTimeout(h); h = setTimeout(fn, 250); }; }

  // ---- building blocks --------------------------------------------------------
  function pill(tone, icon, text) { return el('span', { className: 'jlPill jl-' + tone }, [icon ? JL.icon(icon) : null, text]); }
  function statePill(state) { var x = STATE_TONES[state] || ['off', '']; return pill(x[0], x[1], t('state.' + state)); }
  function cell(label, content, cls) { return el('td', { className: cls || '', attrs: { 'data-label': label } }, [content]); }
  function ellipsis(text, full) { return el('span', { className: 'jlEllipsis', text: text, title: full || text }); }

  /** A table that turns into a list on phones. Clickable tables get a chevron column. */
  function grid(head, rows, clickable) {
    var th = head.map(function (h) { return el('th', { text: h }); });
    if (clickable) { th.push(el('th', { attrs: { 'aria-hidden': 'true' } })); }
    var body = rows.length ? rows : [el('tr', null, [el('td', { className: 'fieldDescription', text: t('table.empty'), attrs: { colspan: String(th.length) } })])];
    return el('table', { className: 'jlTable' }, [el('thead', null, [el('tr', null, th)]), el('tbody', null, body)]);
  }
  function row(cells, onClick) {
    var chev = el('td', { className: 'jlChev' }, [onClick ? JL.icon('chevron_right') : null]);
    if (!onClick) { return el('tr', null, cells.concat([chev])); }
    return el('tr', { className: 'jlClick', attrs: { tabindex: '0', role: 'button' }, on: {
      click: onClick,
      keydown: function (e) { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onClick(); } }
    } }, cells.concat([chev]));
  }
  function slice(list) { return list.rows.slice(list.page * PAGE, list.page * PAGE + PAGE); }
  function pager(id, list, render) {
    var total = list.rows.length;
    if (total <= PAGE) { $(id).replaceChildren(); return; }
    var from = list.page * PAGE + 1, to = Math.min(total, from + PAGE - 1);
    var prev = JL.button(t('pager.prev'), 'flat', function () { list.page--; render(); }, 'chevron_left');
    var next = JL.button(t('pager.next'), 'flat', function () { list.page++; render(); }, 'chevron_right');
    prev.disabled = list.page === 0;
    next.disabled = to >= total;
    $(id).replaceChildren(prev, el('span', { className: 'fieldDescription jlNum', text: t('pager.range', { from: from, to: to, total: total }) }), next);
  }
  function setUsers(list) {
    users = list;
    ['jl-b-user', 'jl-a-user'].forEach(function (id) {
      var select = $(id), keep = select.value;
      select.replaceChildren(select.options[0]);
      users.forEach(function (u) { select.appendChild(el('option', { value: u.Id, text: u.Name })); });
      select.value = keep;
    });
  }
  /** Shows each { Field, Error } under its field (data-err) and focuses the first; true when every error found its field. */
  function fieldErrors(list, scope) {
    var first = null, placed = true;
    list.forEach(function (fe) {
      var slot = scope.querySelector('[data-err="' + fe.Field + '"]');
      if (!slot) { placed = false; return; }
      slot.textContent = JL.msgText(fe.Error, 'val.');
      slot.hidden = false;
      var input = slot.parentNode.querySelector('input, select');
      if (input) { input.setAttribute('aria-invalid', 'true'); if (!first) { first = input; } }
    });
    if (first) { first.focus(); }
    return placed;
  }
  function clearFieldErrors(scope) {
    Array.prototype.forEach.call(scope.querySelectorAll('[data-err]'), function (s) { s.hidden = true; s.textContent = ''; });
    Array.prototype.forEach.call(scope.querySelectorAll('[aria-invalid]'), function (i) { i.removeAttribute('aria-invalid'); });
  }

  // ---- overview -----------------------------------------------------------------
  function tile(label, value, opts) {
    opts = opts || {};
    var kids = [el('span', { className: 'fieldDescription', text: label }), el('span', { className: 'jlKpiValue' }, [opts.icon ? JL.icon(opts.icon) : null, value]),
      opts.hint ? el('span', { className: 'fieldDescription', text: opts.hint }) : null];
    var cls = 'paperList jlKpi' + (opts.tone ? ' jlTone-' + opts.tone : '');
    return opts.onClick ? el('button', { type: 'button', className: cls, on: { click: opts.onClick } }, kids) : el('div', { className: cls }, kids);
  }

  function openBatches(state) { $('jl-b-q').value = ''; $('jl-b-user').value = ''; $('jl-b-days').value = '0'; $('jl-b-state').value = state; selectTab('batches'); }

  function svg(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  function chart(o) {
    var box = $('jl-chart');
    var width = Math.max(280, box.clientWidth || 600), span = width < 600 ? 14 : 30;
    var today = Math.floor(Date.now() / 86400000), first = today - span + 1;
    var byDay = {}, totals = {};
    o.Days.forEach(function (d) {
      if (d.Day < first) { return; }
      var u = String(d.UserId);
      (byDay[d.Day] = byDay[d.Day] || {})[u] = d.Bytes;
      totals[u] = (totals[u] || 0) + d.Bytes;
    });
    $('jl-chart-title').textContent = t('chart.title', { n: span });
    var ids = Object.keys(totals);
    if (!ids.length) { box.replaceChildren(el('p', { className: 'fieldDescription', text: t('chart.empty') })); return; }
    var colors = JL.userColors(totals);
    var named = ids.filter(function (u) { return colors[u]; }).sort(function (a, b) { return JL.PALETTE.indexOf(colors[a]) - JL.PALETTE.indexOf(colors[b]); });
    var others = ids.filter(function (u) { return !colors[u]; });
    function name(u) { return o.UserNames[u] || u; }
    function parts(day) {
      var r = byDay[day] || {}, out = [];
      named.forEach(function (u) { if (r[u]) { out.push({ label: name(u), color: colors[u], bytes: r[u] }); } });
      var rest = others.reduce(function (n, u) { return n + (r[u] || 0); }, 0);
      if (rest) { out.push({ label: t('chart.others'), color: 'var(--jl-off-fg)', bytes: rest }); }
      return out;
    }
    function sum(list) { return list.reduce(function (n, p) { return n + p.bytes; }, 0); }
    var max = 1, day;
    for (day = first; day <= today; day++) { max = Math.max(max, sum(parts(day))); }

    var H = 180, padL = 64, padB = 22, padT = 6, plotH = H - padB - padT, bw = (width - padL) / span;
    var chartSvg = svg('svg', { width: String(width), height: String(H), role: 'img', 'aria-label': t('chart.label'), 'class': 'jlChart' });
    [0, 0.5, 1].forEach(function (f) {
      var y = padT + plotH * (1 - f);
      chartSvg.appendChild(svg('line', { x1: String(padL), x2: String(width), y1: String(y), y2: String(y) }));
      var label = svg('text', { x: String(padL - 6), y: String(y + 4), 'text-anchor': 'end' });
      label.textContent = JL.formatBytes(Math.round(max * f));
      chartSvg.appendChild(label);
    });
    var tip = el('div', { className: 'jlTip', hidden: true });
    var pinned = null;
    function showTip(d0, list, x) {
      tip.replaceChildren.apply(tip, [el('b', { text: JL.formatDate(d0 * 86400 + 43200) })].concat(list.map(function (p) {
        var sw = el('span', { className: 'jlSwatch' });
        sw.style.background = p.color;
        return el('div', null, [sw, p.label + ' · ' + JL.formatBytes(p.bytes)]);
      }), [el('div', { className: 'fieldDescription', text: t('chart.total') + ' · ' + JL.formatBytes(sum(list)) })]));
      tip.style.left = Math.max(0, Math.min(x, width - 200)) + 'px';
      tip.hidden = false;
    }
    function hideTip() { if (pinned === null) { tip.hidden = true; } }
    for (var i = 0; i < span; i++) {
      (function (i) {
        var d0 = first + i, x = padL + i * bw, list = parts(d0), y = padT + plotH;
        var g = svg('g', { tabindex: '0', 'class': 'jlDay', 'aria-label': JL.formatDate(d0 * 86400 + 43200) + ' · ' + JL.formatBytes(sum(list)) });
        g.appendChild(svg('rect', { x: String(x), y: String(padT), width: String(bw), height: String(plotH), fill: 'transparent' }));
        list.forEach(function (p) {
          var h = (p.bytes / max) * plotH;
          y -= h;
          var r = svg('rect', { x: String(x + 1), y: String(y), width: String(Math.max(1, bw - 2)), height: String(Math.max(1, h > 4 ? h - 2 : h)) });
          r.style.fill = p.color;
          g.appendChild(r);
        });
        g.addEventListener('mouseenter', function () { if (list.length) { showTip(d0, list, x); } });
        g.addEventListener('mouseleave', hideTip);
        g.addEventListener('focus', function () { if (list.length) { showTip(d0, list, x); } });
        g.addEventListener('blur', hideTip);
        g.addEventListener('click', function () { pinned = pinned === d0 ? null : d0; if (pinned === null) { tip.hidden = true; } else if (list.length) { showTip(d0, list, x); } });
        chartSvg.appendChild(g);
        if ((span - 1 - i) % 7 === 0) {
          var last = i === span - 1;
          var lab = svg('text', { x: String(last ? width : x + bw / 2), y: String(H - 6), 'text-anchor': last ? 'end' : 'middle' });
          lab.textContent = last ? t('chart.today') : JL.formatDay(d0 * 86400 + 43200);
          chartSvg.appendChild(lab);
        }
      })(i);
    }
    var series = named.map(function (u) { return { label: name(u), color: colors[u] }; });
    if (others.length) { series.push({ label: t('chart.others'), color: 'var(--jl-off-fg)' }); }
    var legend = series.length > 1 ? el('div', { className: 'jlLegend fieldDescription' }, series.map(function (s) {
      var sw = el('span', { className: 'jlSwatch' });
      sw.style.background = s.color;
      return el('span', null, [sw, s.label]);
    })) : null;
    var srRows = [];
    for (day = first; day <= today; day++) {
      parts(day).forEach(function (p) { srRows.push(el('tr', null, [el('td', { text: JL.formatDate(day * 86400 + 43200) }), el('td', { text: p.label }), el('td', { text: JL.formatBytes(p.bytes) })])); });
    }
    var sr = el('table', { className: 'jlSr' }, [el('caption', { text: t('chart.label') }), el('tbody', null, srRows)]);
    box.replaceChildren.apply(box, [chartSvg, tip, legend, sr].filter(Boolean));
  }

  function loadOverview() {
    return api('GET', 'overview').then(function (o) {
      var s = o.Stats;
      lastOverview = o;
      $('jl-kpis').replaceChildren(
        tile(t('kpi.active'), String(s.ActiveBatches)),
        tile(t('kpi.served'), JL.formatBytes(s.ServedBytes7d)),
        tile(t('kpi.completed'), String(s.CompletedFiles7d)),
        tile(t('kpi.flagged'), String(s.FlaggedBatches), { icon: 'warning', tone: s.FlaggedBatches ? 'warn' : '', hint: t('kpi.flaggedHint'), onClick: function () { openBatches('flagged'); } }),
        tile(t('kpi.blocked'), String(s.BlockedBatches), { icon: 'block', tone: s.BlockedBatches ? 'bad' : '', onClick: function () { openBatches('blocked'); } }));
      chart(o);
      $('jl-top-titles').replaceChildren(grid([t('col.title'), t('col.volume')], o.TopTitles.map(function (x) {
        return el('tr', null, [cell(t('col.title'), ellipsis(x.Name)), cell(t('col.volume'), JL.formatBytes(x.Bytes), 'jlNum')]);
      })));
      $('jl-top-users').replaceChildren(grid([t('col.user'), t('col.volume')], o.TopUsers.map(function (x) {
        return el('tr', null, [cell(t('col.user'), x.Name), cell(t('col.volume'), JL.formatBytes(x.Bytes), 'jlNum')]);
      })));
    });
  }

  // ---- batches ------------------------------------------------------------------
  function loadBatches() {
    var state = $('jl-b-state').value;
    return latest('batches', api('GET', 'batches?' + query({ q: $('jl-b-q').value.trim(), state: state === 'flagged' ? 'active' : state, user: $('jl-b-user').value, days: $('jl-b-days').value })))
      .then(function (list) {
        lists.batches = { rows: state === 'flagged' ? list.filter(function (x) { return x.Batch.DistinctIps >= 2; }) : list, page: 0 };
        renderBatches();
      });
  }

  function renderBatches() {
    var rows = slice(lists.batches).map(function (x) {
      var b = x.Batch, flagged = b.State === 'active' && b.DistinctIps >= 2;
      return row([
        cell(t('col.batch'), el('div', null, [ellipsis(JL.batchTitle(b)), el('div', { className: 'fieldDescription', text: t('gen.total', { n: b.FileCount, size: JL.formatBytes(b.TotalBytes) }) })])),
        cell(t('col.user'), x.UserName),
        cell(t('col.created'), JL.formatWhen(b.CreatedAt), 'jlNum'),
        cell(t('col.progress'), b.CompleteCount + '/' + b.FileCount, 'jlNum'),
        cell(t('col.addresses'), flagged ? pill('warn', 'warning', String(b.DistinctIps)) : String(b.DistinctIps), 'jlNum'),
        cell(t('col.state'), statePill(b.State))
      ], function () { showBatch(b.Id); });
    });
    $('jl-batches').replaceChildren(grid([t('col.batch'), t('col.user'), t('col.created'), t('col.progress'), t('col.addresses'), t('col.state')], rows, true));
    pager('jl-batches-pager', lists.batches, renderBatches);
  }

  function showBatch(id) {
    var d = JL.openDialog(t('col.batch'));
    d.dialog.classList.add('jlWide');
    d.content.replaceChildren(JL.spinner());
    d.footer.replaceChildren(JL.button(t('close'), 'cancel', d.close));
    function after(key) { JL.toast(t(key)); load(); run(loadBatches()); }
    function failed(err) { JL.toast(JL.errorText(err)); load(); }
    function post(path, key) { api('POST', 'batches/' + id + '/' + path).then(function () { after(key); }, failed); }
    function load() {
      api('GET', 'batches/' + id).then(render, function (err) {
        d.content.replaceChildren(el('div', { className: 'jlAlert jl-bad', text: JL.errorText(err), attrs: { role: 'alert' } }));
      });
    }
    function render(x) {
      var b = x.Batch, acts = [];
      if (b.State === 'blocked') {
        acts.push(JL.button(t('batch.unblock'), 'submit', function () { post('unblock?raise=false', 'batch.unblocked'); }));
        acts.push(JL.button(t('batch.unblockRaise'), 'cancel', function () { post('unblock?raise=true', 'batch.unblocked'); }));
      }
      if (b.State === 'active' || b.State === 'blocked') {
        acts.push(JL.button(t('batch.revoke'), 'delete', function () {
          JL.confirm({ title: t('batch.revokeQ'), text: t('batch.revokeText'), ok: t('batch.revoke'), danger: true })
            .then(function (yes) { if (yes) { post('revoke', 'batch.revoked'); } });
        }));
      }
      if (b.State === 'active') {
        acts.push(JL.button(t('batch.copy'), 'flat', function () {
          api('GET', 'batches/' + id + '/links').then(function (urls) {
            return JL.copyText(urls.join('\n') + '\n').then(function (ok) { JL.toast(ok ? t('gen.copied', { n: urls.length }) : t('gen.manual')); });
          }, failed);
        }, 'content_copy'));
      }
      var sessions = x.Sessions.map(function (s) {
        var flagged = s.NewIp && b.DistinctIps > 1;
        return el('tr', null, [
          cell(t('col.when'), JL.formatWhen(s.FirstAt), 'jlNum'),
          cell(t('col.file'), ellipsis(s.FileName)),
          cell(t('col.address'), flagged ? pill('warn', 'warning', s.Ip) : s.Ip),
          cell(t('col.client'), ellipsis(JL.shortUa(s.UserAgent), s.UserAgent)),
          cell(t('col.duration'), JL.formatDuration(s.LastAt - s.FirstAt), 'jlNum'),
          cell(t('col.received'), JL.formatBytes(s.CoveredBytes) + ' / ' + JL.formatBytes(s.Size), 'jlNum'),
          cell(t('col.status'), pill(SESSION_TONES[s.Status] || 'off', '', t('session.' + s.Status)))
        ]);
      });
      var events = x.Events.map(function (e) {
        return el('tr', null, [cell(t('col.when'), JL.formatWhen(e.At), 'jlNum'), cell(t('col.what'), t('kind.' + e.Kind)), cell(t('col.detail'), JL.msgText(e.Detail, 'ev.'))]);
      });
      d.content.replaceChildren(
        el('h3', { text: JL.batchTitle(b) }),
        el('div', { className: 'jlInline' }, [el('span', { text: x.UserName }), statePill(b.State),
          x.Reason ? el('span', { className: 'fieldDescription', text: JL.msgText(x.Reason, 'reason.') }) : null,
          el('span', { className: 'fieldDescription', text: x.IpLimit > 0 ? t('batch.limit', { n: x.IpLimit }) : t('batch.noLimit') })]),
        el('div', { className: 'jlActions' }, acts),
        el('h3', { className: 'jlSection', text: t('batch.sessions') }),
        sessions.length ? grid([t('col.when'), t('col.file'), t('col.address'), t('col.client'), t('col.duration'), t('col.received'), t('col.status')], sessions)
          : el('p', { className: 'fieldDescription', text: t('batch.noSessions') }),
        el('h3', { className: 'jlSection', text: t('batch.events') }),
        grid([t('col.when'), t('col.what'), t('col.detail')], events));
    }
    load();
  }

  // ---- activity -----------------------------------------------------------------
  function loadActivity() {
    return latest('activity', api('GET', 'activity?' + query({ q: $('jl-a-q').value.trim(), kind: $('jl-a-kind').value, user: $('jl-a-user').value, days: $('jl-a-days').value })))
      .then(function (list) { lists.activity = { rows: list, page: 0 }; renderActivity(); });
  }

  function renderActivity() {
    var rows = slice(lists.activity).map(function (e) {
      return row([
        cell(t('col.when'), JL.formatWhen(e.At), 'jlNum'),
        cell(t('col.what'), t('kind.' + e.Kind)),
        cell(t('col.user'), e.UserName),
        cell(t('col.batch'), e.BatchLabel ? ellipsis(JL.batchTitle({ Label: e.BatchLabel, Scope: e.BatchScope })) : '—'),
        cell(t('col.detail'), JL.msgText(e.Detail, 'ev.'))
      ], e.BatchId ? function () { showBatch(e.BatchId); } : null);
    });
    $('jl-activity').replaceChildren(grid([t('col.when'), t('col.what'), t('col.user'), t('col.batch'), t('col.detail')], rows, true));
    pager('jl-activity-pager', lists.activity, renderActivity);
  }

  // ---- users --------------------------------------------------------------------
  function quotaText(u) {
    var q = u.Quota;
    if (!q.Enabled) { return t('quota.none'); }
    var text = t('quota.summary', { volume: q.VolumeBytes > 0 ? JL.formatBytes(q.VolumeBytes) : t('quota.unlimited'), n: q.PeriodDays });
    if (q.MaxActiveBatches > 0) { text += ' · ' + t('quota.summaryBatches', { n: q.MaxActiveBatches }); }
    return u.HasOverride ? text + ' · ' + t('quota.override') : text;
  }

  function loadUsers() {
    return api('GET', 'users').then(function (list) {
      setUsers(list);
      $('jl-users').replaceChildren(grid([t('col.user'), t('col.permission'), t('col.quota'), t('col.used'), t('col.activeBatches'), t('col.archived')], list.map(function (u) {
        return row([
          cell(t('col.user'), el('span', null, [u.Name + ' ', u.IsAdmin ? pill('off', '', t('user.admin')) : null])),
          cell(t('col.permission'), pill(u.CanDownload ? 'ok' : 'off', '', t(u.CanDownload ? 'user.allowed' : 'user.denied'))),
          cell(t('col.quota'), quotaText(u)),
          cell(t('col.used'), JL.formatBytes(u.UsedBytes), 'jlNum'),
          cell(t('col.activeBatches'), String(u.ActiveBatches), 'jlNum'),
          cell(t('col.archived'), u.ArchivedBytes ? t('user.archived', { size: JL.formatBytes(u.ArchivedBytes), n: u.ArchivedCompleted }) : '—')
        ], function () { editUser(u); });
      }), true));
    });
  }

  function editUser(u) {
    var q = u.Quota, g = globals || { QuotaVolumeBytes: 0, QuotaPeriodDays: 7, QuotaMaxActiveBatches: 0 };
    var d = JL.openDialog(t('user.quotaTitle', { name: u.Name }));
    function field(id, label, err, value, placeholder, min, max) {
      var attrs = { is: 'emby-input', min: String(min), step: 'any', placeholder: String(placeholder) };
      if (max != null) { attrs.max = String(max); }
      var input = el('input', { type: 'number', id: id, value: value, attrs: attrs });
      return { input: input, box: el('div', { className: 'inputContainer' }, [el('label', { className: 'inputLabel', attrs: { 'for': id }, text: label }), input,
        el('div', { className: 'fieldDescription jlFieldError', attrs: { 'data-err': err }, hidden: true })]) };
    }
    var vol = field('jl-u-vol', t('user.volume'), 'VolumeBytes', u.HasOverride ? String(Number((q.VolumeBytes / 1e9).toFixed(3))) : '', Number((g.QuotaVolumeBytes / 1e9).toFixed(3)), 0, null);
    var days = field('jl-u-days', t('user.days'), 'PeriodDays', u.HasOverride ? String(q.PeriodDays) : '', g.QuotaPeriodDays, 1, 365);
    var max = field('jl-u-max', t('user.max'), 'MaxActiveBatches', u.HasOverride ? String(q.MaxActiveBatches) : '', g.QuotaMaxActiveBatches, 0, 1000);
    function done(key) { JL.toast(t(key)); d.close(); run(loadUsers()); }
    function failed(err) { if (!(err && Array.isArray(err.body) && fieldErrors(err.body, d.content))) { JL.toast(JL.errorText(err)); } }
    d.content.replaceChildren(el('p', { className: 'fieldDescription', text: t('user.quotaHelp') }), vol.box, days.box, max.box,
      el('p', { className: 'fieldDescription', text: t('user.emptyHint') }));
    var buttons = [];
    if (u.HasOverride) {
      buttons.push(JL.button(t('user.reset'), 'flat', function () { api('DELETE', 'users/' + u.Id + '/quota').then(function () { done('user.cleared'); }, failed); }));
    }
    buttons.push(JL.button(t('cancel'), 'cancel', d.close));
    buttons.push(JL.button(t('user.save'), 'submit', function () {
      clearFieldErrors(d.content);
      api('PUT', 'users/' + u.Id + '/quota', {
        VolumeBytes: vol.input.value === '' ? g.QuotaVolumeBytes : Math.round(Number(vol.input.value) * 1e9),
        PeriodDays: days.input.value === '' ? g.QuotaPeriodDays : Number(days.input.value),
        MaxActiveBatches: max.input.value === '' ? g.QuotaMaxActiveBatches : Number(max.input.value)
      }).then(function () { done('user.saved'); }, failed);
    }));
    d.footer.replaceChildren.apply(d.footer, buttons);
  }

  // ---- settings -----------------------------------------------------------------
  function syncQuota() {
    ['jl-s-qvol', 'jl-s-qdays', 'jl-s-qmax'].forEach(function (id) { $(id).disabled = !$('jl-s-qon').checked; });
  }

  function fillSettings(s) {
    $('jl-s-validity').value = s.LinkValidityDays; $('jl-s-iplimit').value = s.IpLimit; $('jl-s-public').value = s.PublicBaseUrl;
    $('jl-s-qon').checked = s.QuotaEnabled; $('jl-s-qvol').value = Number((s.QuotaVolumeBytes / 1e9).toFixed(3));
    $('jl-s-qdays').value = s.QuotaPeriodDays; $('jl-s-qmax').value = s.QuotaMaxActiveBatches; $('jl-s-ret').value = s.RetentionDays;
    $('jl-s-hook').value = s.WebhookUrl; $('jl-s-fmt').value = s.WebhookFormat;
    $('jl-s-n-blocked').checked = s.NotifyBatchBlocked; $('jl-s-n-ip').checked = s.NotifyNewIp;
    $('jl-s-n-quota').checked = s.NotifyQuotaReached; $('jl-s-n-done').checked = s.NotifyBatchCompleted;
    syncQuota();
  }

  function loadSettings() { return api('GET', 'settings').then(function (s) { globals = s; fillSettings(s); }); }

  function readSettings() {
    return {
      LinkValidityDays: Number($('jl-s-validity').value), IpLimit: Number($('jl-s-iplimit').value), QuotaEnabled: $('jl-s-qon').checked,
      QuotaVolumeBytes: Math.round(Number($('jl-s-qvol').value) * 1e9), QuotaPeriodDays: Number($('jl-s-qdays').value),
      QuotaMaxActiveBatches: Number($('jl-s-qmax').value), RetentionDays: Number($('jl-s-ret').value), WebhookUrl: $('jl-s-hook').value.trim(),
      WebhookFormat: $('jl-s-fmt').value, NotifyBatchBlocked: $('jl-s-n-blocked').checked, NotifyNewIp: $('jl-s-n-ip').checked,
      NotifyQuotaReached: $('jl-s-n-quota').checked, NotifyBatchCompleted: $('jl-s-n-done').checked, PublicBaseUrl: $('jl-s-public').value.trim()
    };
  }

  // ---- wiring -------------------------------------------------------------------
  var loaders = { overview: loadOverview, batches: loadBatches, activity: loadActivity, users: loadUsers, settings: loadSettings };

  function selectTab(name) {
    current = name;
    Array.prototype.forEach.call(page.querySelectorAll('.jl-tab'), function (tab) {
      var on = tab.getAttribute('data-tab') === name;
      tab.setAttribute('aria-selected', String(on));
      tab.setAttribute('tabindex', on ? '0' : '-1');
    });
    Array.prototype.forEach.call(page.querySelectorAll('.jl-pane'), function (p) { p.hidden = p.getAttribute('data-pane') !== name; });
    return run(busy(loaders[name]()));
  }

  var wired = false;
  function wire() {
    if (wired) { return; }
    wired = true;
    var tabs = Array.prototype.slice.call(page.querySelectorAll('.jl-tab'));
    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () { selectTab(tab.getAttribute('data-tab')); });
      tab.addEventListener('keydown', function (e) {
        var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!step) { return; }
        e.preventDefault();
        var next = tabs[(i + step + tabs.length) % tabs.length];
        next.focus();
        selectTab(next.getAttribute('data-tab'));
      });
    });
    KINDS.forEach(function (k) { $('jl-a-kind').appendChild(el('option', { value: k, text: t('kind.' + k) })); });
    function batches() { return run(loadBatches()); }
    function activity() { return run(loadActivity()); }
    $('jl-b-q').addEventListener('input', debounce(batches));
    ['jl-b-state', 'jl-b-user', 'jl-b-days'].forEach(function (id) { $(id).addEventListener('change', batches); });
    $('jl-a-q').addEventListener('input', debounce(activity));
    ['jl-a-kind', 'jl-a-user', 'jl-a-days'].forEach(function (id) { $(id).addEventListener('change', activity); });
    $('jl-s-qon').addEventListener('change', syncQuota);
    window.addEventListener('resize', debounce(function () { if (current === 'overview' && lastOverview && page.isConnected) { chart(lastOverview); } }));
    $('jl-settings').addEventListener('submit', function (e) {
      e.preventDefault();
      var form = $('jl-settings');
      clearFieldErrors(form);
      $('jl-s-errors').hidden = true;
      var body = readSettings();
      api('POST', 'settings', body).then(function () {
        globals = body;
        if (window.Dashboard && Dashboard.processPluginConfigurationUpdateResult) { Dashboard.processPluginConfigurationUpdateResult(); } else { JL.toast(t('set.saved')); }
      }, function (err) {
        var placed = err && Array.isArray(err.body) && fieldErrors(err.body, form);
        $('jl-s-errors').textContent = placed ? t('set.fix') : JL.errorText(err);
        $('jl-s-errors').hidden = false;
      });
    });
    $('jl-s-test').addEventListener('click', function () {
      var out = $('jl-s-test-msg');
      out.className = 'fieldDescription';
      out.textContent = t('set.testing');
      api('POST', 'settings/test-webhook', { Url: $('jl-s-hook').value.trim(), Format: $('jl-s-fmt').value }).then(function (r) {
        out.className = 'jlPill ' + (r.Ok ? 'jl-ok' : 'jl-bad');
        out.textContent = JL.msgText(r.Result, 'hook.');
      }, function (err) { out.className = 'jlPill jl-bad'; out.textContent = JL.errorText(err); });
    });
    $('jl-revoke-all').addEventListener('click', function () {
      JL.confirm({ title: t('all.title'), text: t('all.text'), ok: t('all.ok'), danger: true, typed: t('all.word') }).then(function (yes) {
        if (!yes) { return; }
        api('POST', 'revoke-all').then(function (r) { JL.toast(t('ev.all_revoked', { n: r.Revoked })); return selectTab(current); }, showError);
      });
    });
  }

  function checkInjector() {
    ApiClient.getJSON(ApiClient.getUrl('Plugins')).then(function (plugins) {
      $('jl-dep').hidden = plugins.some(function (p) { return p.Status === 'Active' && /javascript injector/i.test(p.Name); });
    }, function () {});
  }

  // pageshow and viewshow both fire on each open (10.11 and 12): ignore the second while the first loads.
  var opening = false;
  function show() {
    if (opening) { return; }
    opening = true;
    busy(loadCore()).then(function (core) {
      JL = core; t = JL.t; el = JL.el;
      translate();
      wire();
      JL.applyTheme(root, surface());
      checkInjector();
      return Promise.all([api('GET', 'users'), api('GET', 'settings')]);
    }).then(function (r) {
      setUsers(r[0]);
      globals = r[1];
      return selectTab(current);
    }).then(null, function (e) {
      if (JL) { showError(e); } else { $('jl-error').textContent = 'JellyLinks · ' + ((e && e.status) || 0); $('jl-error').hidden = false; }
    }).then(function () { opening = false; });
  }
  page.addEventListener('pageshow', show);
  page.addEventListener('viewshow', show);
})();
</script>
</div>
