name: Question
description: Ask about installation, configuration or usage.
labels: [question]

body:
  - type: textarea
    id: what_trying_to_do
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: what_tried
    attributes:
      label: What have you tried?
      description: Steps or settings you already tried, so nobody suggests them again.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: JellyLinks / Jellyfin versions
      placeholder: "e.g. JellyLinks 0.3.0 / Jellyfin 12.0"

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Screenshots or settings that might help (never a download link or a token).
