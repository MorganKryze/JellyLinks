name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"
      - name: Server tests
        run: dotnet test --configuration Release
      - name: Client tests
        run: TZ=UTC node --test tests/client/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"
      - name: Package
        id: package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S)"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Jellyfin.Plugin.JellyLinks.zip"
          CHANGELOG="$(gh release view "${TAG}" --json body -q '.body | gsub("\r"; "") | gsub("\n"; "\r\n")' 2>/dev/null || true)"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi
          git fetch origin main
          git checkout main
          jq --arg ver "$VERSION" --arg chk "$CHECKSUM" --arg ts "$TIMESTAMP" --arg url "$SOURCE_URL" --arg log "$CHANGELOG" \
            '.[0].versions = ([{ version: $ver, checksum: $chk, changelog: $log, targetAbi: "10.11.10.0", sourceUrl: $url, timestamp: $ts }] + .[0].versions)' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest for ${TAG}"
          git push origin main
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/Jellyfin.Plugin.JellyLinks.zip --clobber
