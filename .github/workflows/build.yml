name: Build

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"
      - name: Server tests
        run: dotnet test --configuration Release
      - name: Client tests
        run: TZ=UTC node --test tests/client/*.test.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"
      - name: Package
        id: package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/Jellyfin.Plugin.JellyLinks.zip --clobber
      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S)"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Jellyfin.Plugin.JellyLinks.zip"
          CHANGELOG="$(gh release view "${TAG}" --json body -q '.body | gsub("\r"; "") | gsub("\n"; "\r\n")' 2>/dev/null || true)"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi
          git fetch origin main
          git checkout main
          jq --arg ver "$VERSION" --arg chk "$CHECKSUM" --arg ts "$TIMESTAMP" --arg url "$SOURCE_URL" --arg log "$CHANGELOG" \
            'if any(.[0].versions[]; .version == $ver) then . else .[0].versions = ([{ version: $ver, checksum: $chk, changelog: $log, targetAbi: "10.11.10.0", sourceUrl: $url, timestamp: $ts }] + .[0].versions) end' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          if git diff --quiet -- manifest.json; then
            echo "manifest already up to date for ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest for ${TAG}"
          git push origin main
